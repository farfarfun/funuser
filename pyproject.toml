[project]
name = "funuser"
version = "0.1.3"
description = "User Management System"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "bcrypt>=4.0,<4.1",
    "click>=8.1.8",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "funsecret>=1.4.96",
    "passlib[bcrypt]>=1.7.4",
    "pydantic[email]>=2.4.2",
    "pymysql>=1.1.1",
    "python-jose[cryptography]>=3.4.0",
    "sqlalchemy>=2.0.40",
    "tomli>=2.0.1; python_version < '3.11'",
    "uvicorn>=0.33.0",
]
[[project.authors]]
name = "niuliangtao"
email = "farfarfun@qq.com"

[project.urls]
Repository = "https://github.com/farfarfun/funuser"
Releases = "https://github.com/farfarfun/funuser/releases"

[project.scripts]
funuser = "funuser.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "funbuild>=1.6.80",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.13.0",
]
